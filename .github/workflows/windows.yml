name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: dotnet build native/windows-host/Alfred.WindowsHost.csproj -c Release
      - shell: pwsh
        run: ./scripts/windows/test-e2e.ps1 -SkipDesktop -HostPath native/windows-host/bin/Release/net10.0-windows/win-x64/alfred-windows-host.exe
      - shell: pwsh
        run: ./scripts/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Alfred-Windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
