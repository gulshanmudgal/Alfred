name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: npm ci
      - run: npm run build
      - run: dotnet publish native/windows-host/Alfred.WindowsHost.csproj -c Release -r win-x64 --self-contained true
      - name: Stage Windows automation sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item native/windows-host/bin/Release/net10.0-windows/win-x64/publish/alfred-windows-host.exe src-tauri/binaries/alfred-windows-host-x86_64-pc-windows-msvc.exe -Force
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - shell: pwsh
        run: ./scripts/windows/test-e2e.ps1 -SkipDesktop -HostPath native/windows-host/bin/Release/net10.0-windows/win-x64/publish/alfred-windows-host.exe
      - shell: pwsh
        run: ./scripts/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Alfred-Windows-release
          path: |
            dist/windows/Alfred-Windows-x64-portable.zip
            dist/windows/Alfred-Windows-x64-portable.zip.sha256
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows/Alfred-Windows-x64-portable.zip
            dist/windows/Alfred-Windows-x64-portable.zip.sha256
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
